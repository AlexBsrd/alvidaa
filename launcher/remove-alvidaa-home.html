<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remove Alvidaa Home</title><style>
body{margin:0;background:#10131a;color:#eef2f7;font:18px system-ui,sans-serif;padding:8vh 8vw}main{max-width:760px;margin:auto}h1{font-size:36px}p{line-height:1.55;color:#b8c1ce}button{font:inherit;font-weight:700;padding:16px 24px;border:0;border-radius:12px;background:#fca5a5;color:#220b0b}button:disabled{opacity:.55}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#080a0f;border-radius:12px;padding:16px;min-height:56px}</style></head><body><main>
<h1>Remover Alvidaa Home</h1>
<p>Remove somente a entrada <code>vidaa-home</code>. As outras entradas permanecem. Se o registro não mudou desde a instalação, a cópia original será restaurada exatamente.</p>
<button id="remove">Remover Home</button><pre id="out">Aguardando sua ação.</pre>
</main><script src="/api/server-config.js"></script><script>
(function(){"use strict";var button=document.getElementById("remove"),out=document.getElementById("out"),service=window.vowOS&&window.vowOS.service;
function show(label,value){out.textContent=label+"\n"+(typeof value==="string"?value:JSON.stringify(value,null,2));}
function startFetcher(){return new Promise(function(resolve){var done=false,t=setTimeout(function(){finish({event:"timeout"});},12000);function finish(v){if(done)return;done=true;clearTimeout(t);resolve(v);}try{var q=service.execute("phoenix://service/basic/fetcher",{method:"start",timeout:10,onComplete:function(m){finish({event:"complete",message:m});},onError:function(m){finish({event:"error",message:m});}});if(q!==true)finish({event:"not_queued",value:q});}catch(e){finish({event:"exception",message:String(e)});}});}
function post(name){return fetch("http://localhost:9009/function/basic/fetch/"+name,{method:"POST",headers:{"Content-Type":"application/json","identifier":""},body:"{}"}).then(function(r){return r.text().then(function(text){return{status:r.status,text:text};});}).catch(function(e){return{error:String(e)};});}
button.addEventListener("click",async function(){button.disabled=true;try{if(!service||typeof service.syncExecute!=="function"||typeof service.execute!=="function")throw new Error("Fetcher VIDAA indisponível nesta página");var start=await startFetcher();if(start.event!=="complete")throw new Error("Não foi possível iniciar Fetcher: "+JSON.stringify(start));var name="alvidaa_home_remove_"+Date.now().toString(36);var staged=service.syncExecute("basic/fetcher",{api:"fetchFile",args:JSON.stringify({url:AlvidaaConfig.serverUrl+"/remove-alvidaa-home.js",directory:"/APPS/pkgs/tv.vidaa.jsservice.basic/CHA/functions/fetch/"+name+".js"})});if(!staged||staged.ret!==true)throw new Error("Não foi possível preparar o módulo temporário: "+JSON.stringify(staged));var result=await post(name);show("Resultado da remoção",result);if(result.status!==200)button.disabled=false;}catch(e){show("Remoção não concluída",String(e));button.disabled=false;}});
})();
</script></body></html>
