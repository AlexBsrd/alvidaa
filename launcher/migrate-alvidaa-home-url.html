<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Update Alvidaa Home</title><script src="/api/server-config.js"></script></head><body><pre id="out">Updating the Alvidaa Home URL…</pre><script>
(function(){"use strict";var out=document.getElementById("out"),service=window.vowOS&&window.vowOS.service;
function show(v){out.textContent=typeof v==="string"?v:JSON.stringify(v,null,2);}
function start(){return new Promise(function(resolve){var done=false,t=setTimeout(function(){finish({event:"timeout"});},12000);function finish(v){if(done)return;done=true;clearTimeout(t);resolve(v);}try{var q=service.execute("phoenix://service/basic/fetcher",{method:"start",timeout:10,onComplete:function(m){finish({event:"complete",message:m});},onError:function(m){finish({event:"error",message:m});}});if(q!==true)finish({event:"not_queued",value:q});}catch(e){finish({event:"exception",message:String(e)});}});}
async function migrate(){try{if(!service||typeof service.syncExecute!=="function"||typeof service.execute!=="function")throw new Error("VIDAA Fetcher is unavailable on this page");var started=await start();if(started.event!=="complete")throw new Error("Could not start Fetcher: "+JSON.stringify(started));var name="alvidaa_home_migrate_"+Date.now().toString(36);var staged=service.syncExecute("basic/fetcher",{api:"fetchFile",args:JSON.stringify({url:AlvidaaConfig.serverUrl+"/migrate-alvidaa-home-url.js",directory:"/APPS/pkgs/tv.vidaa.jsservice.basic/CHA/functions/fetch/"+name+".js"})});if(!staged||staged.ret!==true)throw new Error("Could not stage the temporary module: "+JSON.stringify(staged));var r=await fetch("http://localhost:9009/function/basic/fetch/"+name,{method:"POST",headers:{"Content-Type":"application/json","identifier":""},body:JSON.stringify({homeUrl:AlvidaaConfig.homeUrl})});show({status:r.status,result:await r.text()});}catch(e){show("Update did not complete: "+String(e));}}
if(/[?&]migrate=confirm(?:&|$)/.test(location.search))migrate();else show("Open with ?migrate=confirm to run the update.");
})();
</script></body></html>
